# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"
early_access: false

tone_instructions: >
  Act as an independent senior/staff engineer reviewing Flok.
  Be concise and high-signal. Prioritize correctness, security,
  architecture, regressions, data integrity, tests, and production risk.
  Avoid cosmetic comments unless they materially improve maintainability.

reviews:
  profile: "assertive"
  # CodeRabbit is an independent reviewer, not the authority that merges.
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
      - "[skip review]"
  path_filters:
    - "!node_modules/**"
    - "!dist/**"
    - "!.output/**"
    - "!.vercel/**"
    - "!coverage/**"
    - "!playwright-report/**"
    - "!test-results/**"
    - "!screenshots/**"
  path_instructions:
    - path: "src/routes/api/**"
      instructions: |
        Treat API changes as security-sensitive.
        Check authentication, authorization, input validation, rate limiting,
        error/status shapes, secret exposure, public/private data boundaries,
        abuse paths, and backwards compatibility.
        Bot bearer-token authentication is separate from optional human Better Auth.
    - path: "src/lib/auth/**"
      instructions: |
        Review as security-critical.
        Check session/token boundaries, redirects, cookies, secret handling,
        authentication versus authorization, production-safe defaults,
        and accidental exposure of private data.
        Spectator access must remain public where FINAL_DESIGN.md requires it.
    - path: "migrations/**"
      instructions: |
        Treat migrations as high-risk.
        Never recommend casually rewriting an already-applied migration.
        Check backwards compatibility, destructive changes, transactional safety,
        migration ordering, indexes, and PGLite/Postgres parity.
    - path: "src/lib/db.ts"
      instructions: |
        Check PGLite/Postgres behavioral parity, server-only boundaries,
        initialization races, transaction safety, JSON-safe result normalization,
        and production database behavior.
    - path: "package.json"
      instructions: |
        Check that new dependencies are genuinely necessary.
        Flag unused or duplicate packages.
        Ensure build verification can run without mutating a production database.
        npm is the current package manager; do not recommend restacking to pnpm.
    - path: ".github/workflows/**"
      instructions: |
        Review workflow permissions using least privilege.
        CI must not use production databases or secrets unnecessarily.
        Required quality gates should cover format, lint, TypeScript, tests,
        pure build, and integration smoke where applicable.
        Do not weaken a legitimate check simply to make CI green.
